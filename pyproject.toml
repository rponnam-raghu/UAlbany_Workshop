[project]
name = "academic-advisor-workshop"
version = "0.1.0"
description = "A fictional academic advisor workshop: prompts, RAG, tools, and trust boundaries."
requires-python = ">=3.12,<3.13"
dependencies = [
  "google-genai>=1.40,<2",
  "streamlit>=1.49,<2",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "psycopg[binary]>=3.2,<4",
  "pgvector>=0.4,<1",
  "numpy>=2.2,<3",
  "PyYAML>=6,<7",
  "pypdf>=6,<7",
  "python-docx>=1.2,<2",
  "openai>=2,<3",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.13,<1", "mypy>=1.18,<2", "types-PyYAML>=6", "pandas-stubs>=2"]

[project.scripts]
advisor = "academic_advisor.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/academic_advisor"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true

[[tool.mypy.overrides]]
module = ["pgvector.*", "psycopg.*", "google.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires a PostgreSQL database", "live: calls the real Gemini API"]
