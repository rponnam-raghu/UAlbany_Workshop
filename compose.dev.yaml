services:
  db:
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-55432}:5432"
  app:
    build:
      target: development
    volumes:
      - ./src:/app/src:ro
      - ./tests:/app/tests:ro
    environment:
      STREAMLIT_SERVER_RUN_ON_SAVE: "true"
      STREAMLIT_SERVER_FILE_WATCHER_TYPE: poll
